<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ESTAS 3 LÍNEAS PROHÍBEN AL NAVEGADOR GUARDAR COPIAS VIEJAS -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Glosario Interactivo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #2c2c2c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 1000px;
    }
    .flip-book {
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
    }
    .page {
      background-color: transparent;
      overflow: hidden;
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="book" class="flip-book"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const totalPaginas = 32; 

      const book = document.getElementById('book');

      for (let i = 1; i <= totalPaginas; i++) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';
        pageDiv.innerHTML = `<img src="${i}.jpg" alt="Página ${i}">`;
        book.appendChild(pageDiv);
      }

      const pageFlip = new St.PageFlip(book, {
        width: 400,
        height: 600,
        size: "stretch",
        minWidth: 300,
        maxWidth: 1000,
        minHeight: 400,
        maxHeight: 1200,
        maxShadowOpacity: 0.3,
        showCover: true,       // Portada y contraportada solas
        flippingTime: 600,     // Animación rápida
        usePortrait: true,
        startPage: 0
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));
    });
  </script>
</body>
</html>

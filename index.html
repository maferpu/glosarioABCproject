<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glosario Interactivo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #2c2c2c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 1000px;
    }
    .flip-book {
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }
    .page {
      background-color: #fff;
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="book" class="flip-book">
      <!-- Cambia el 32 de la siguiente línea por el número total de tus fotos si es distinto -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // PONE AQUÍ EL NÚMERO TOTAL DE PÁGINAS QUE TIENES
      const totalPaginas = 32; 

      const book = document.getElementById('book');

      // Generar automáticamente las páginas
      for (let i = 1; i <= totalPaginas; i++) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';
        pageDiv.innerHTML = `<img src="${i}.jpg" alt="Página ${i}">`;
        book.appendChild(pageDiv);
      }

      // Inicializar el efecto de hojear páginas (StPageFlip)
      const pageFlip = new St.PageFlip(book, {
        width: 400, // ancho de una página en px
        height: 600, // alto de una página en px
        size: "stretch",
        minWidth: 300,
        maxWidth: 1000,
        minHeight: 400,
        maxHeight: 1200,
        maxShadowOpacity: 0.5,
        showCover: true,
        mobileScrollSupport: false
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));
    });
  </script>
</body>
</html>

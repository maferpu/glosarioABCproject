<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta
        name="theme-color"
        content="#181818">

    <meta
        name="description"
        content="Glosario ABC — Libro interactivo">

    <title>Glosario ABC · Libro Interactivo</title>


    <style>

        /* =========================================
           CONFIGURACIÓN GENERAL
        ========================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at center,
                    #3b3b3b 0%,
                    #252525 45%,
                    #151515 100%
                );

            color: white;

            overflow: hidden;

        }


        /* =========================================
           VISOR PRINCIPAL
        ========================================== */

        .viewer {

            width: 100vw;
            height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

            padding: 60px 20px 75px;

        }


        /* =========================================
           ENCABEZADO
           Solo contiene el botón fullscreen
        ========================================== */

        .header {

            position: fixed;

            top: 20px;
            right: 25px;

            z-index: 50;

            pointer-events: none;

        }


        /* =========================================
           BOTÓN PANTALLA COMPLETA
        ========================================== */

        .fullscreen-button {

            pointer-events: auto;

            width: 40px;
            height: 40px;

            border: none;

            background: transparent;

            color: white;

            font-size: 22px;

            cursor: pointer;

            opacity: .75;

            transition:
                opacity .2s ease,
                transform .2s ease;

        }


        .fullscreen-button:hover {

            opacity: 1;

            transform:
                scale(1.08);

        }


        .fullscreen-button:active {

            transform:
                scale(.95);

        }


        /* =========================================
           CONTENEDOR DEL LIBRO
        ========================================== */

        .book-container {

            width: min(94vw, 1100px);

            height: min(80vh, 750px);

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;

        }


        #book {

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.50);

        }


        /* =========================================
           PÁGINAS
        ========================================== */

        .page {

            background: transparent;

            overflow: hidden;

        }


        .page img {

            width: 100%;
            height: 100%;

            object-fit: fill;

            display: block;

            user-select: none;

            -webkit-user-drag: none;

        }


        /* =========================================
           CONTROLES INFERIORES
        ========================================== */

        .controls {

            position: fixed;

            bottom: 20px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 50;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 8px 12px;

            border-radius: 40px;

            background:
                rgba(0,0,0,.45);

            backdrop-filter:
                blur(10px);

        }


        .control-button {

            width: 40px;
            height: 40px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,255,255,.10);

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition:
                background .2s ease,
                transform .2s ease;

        }


        .control-button:hover {

            background:
                rgba(255,255,255,.20);

            transform:
                scale(1.05);

        }


        .control-button:active {

            transform:
                scale(.95);

        }


        .page-counter {

            min-width: 75px;

            text-align: center;

            font-size: 12px;

            letter-spacing: 1px;

            opacity: .85;

        }


        /* =========================================
           PANTALLA DE CARGA
        ========================================== */

        .loading {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            background: #181818;

            transition:
                opacity .5s ease,
                visibility .5s ease;

        }


        .loading.hidden {

            opacity: 0;

            visibility: hidden;

        }


        .loader {

            width: 35px;
            height: 35px;

            border:
                3px solid
                rgba(255,255,255,.15);

            border-top-color:
                white;

            border-radius: 50%;

            animation:
                spin 1s linear infinite;

        }


        .loading-text {

            margin-top: 15px;

            font-size: 13px;

            letter-spacing: 2px;

            opacity: .7;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        /* =========================================
           AVISO PARA CELULAR VERTICAL
        ========================================== */

        .rotate-message {

            position: fixed;

            inset: 0;

            z-index: 200;

            display: none;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 30px;

            background:

                radial-gradient(
                    circle at center,
                    #3b3b3b 0%,
                    #181818 70%
                );

        }


        .rotate-icon {

            font-size: 60px;

            margin-bottom: 25px;

            animation:
                rotatePhone 2s ease-in-out infinite;

        }


        .rotate-message h2 {

            margin: 0 0 12px;

            font-size: 20px;

            font-weight: 500;

        }


        .rotate-message p {

            margin: 0;

            max-width: 280px;

            line-height: 1.6;

            font-size: 14px;

            opacity: .7;

        }


        @keyframes rotatePhone {

            0% {

                transform:
                    rotate(0deg);

            }

            40% {

                transform:
                    rotate(90deg);

            }

            70% {

                transform:
                    rotate(90deg);

            }

            100% {

                transform:
                    rotate(0deg);

            }

        }


        /* =========================================
           CELULAR HORIZONTAL
        ========================================== */

        @media
        screen
        and (max-width: 700px)
        and (orientation: landscape) {


            .viewer {

                padding:
                    35px 10px 50px;

            }


            .header {

                top: 7px;

                right: 10px;

            }


            .fullscreen-button {

                width: 32px;
                height: 32px;

                font-size: 18px;

            }


            .book-container {

                width: 96vw;

                height: 82vh;

            }


            .controls {

                bottom: 8px;

                gap: 7px;

                padding: 5px 8px;

            }


            .control-button {

                width: 32px;
                height: 32px;

                font-size: 15px;

            }


            .page-counter {

                min-width: 60px;

                font-size: 10px;

            }

        }


        /* =========================================
           CELULAR VERTICAL
        ========================================== */

        @media
        screen
        and (max-width: 700px)
        and (orientation: portrait) {


            .rotate-message {

                display: flex;

            }


            .viewer {

                display: none;

            }

        }


        /* =========================================
           TABLET
        ========================================== */

        @media
        screen
        and (min-width: 701px)
        and (max-width: 1100px) {


            .viewer {

                padding:
                    55px 15px 70px;

            }


            .book-container {

                width: 92vw;

                height: 78vh;

            }

        }


        /* =========================================
           PANTALLA COMPLETA
        ========================================== */

        body.fullscreen-mode {

            background: #000;

        }


        body.fullscreen-mode
        .header {

            top: 12px;

        }


        body.fullscreen-mode
        .controls {

            bottom: 12px;

        }

    </style>

</head>


<body>


    <!-- =========================================
         AVISO DE ROTACIÓN
    ========================================== -->

    <section
        class="rotate-message"
        id="rotateMessage">


        <div class="rotate-icon">
            📱
        </div>


        <h2>
            Gira tu dispositivo
        </h2>


        <p>
            Para disfrutar mejor del libro interactivo,
            coloca tu teléfono en posición horizontal.
        </p>


    </section>


    <!-- =========================================
         PANTALLA DE CARGA
    ========================================== -->

    <section
        class="loading"
        id="loading">


        <div class="loader"></div>


        <div class="loading-text">
            Cargando libro...
        </div>


    </section>


    <!-- =========================================
         VISOR PRINCIPAL
    ========================================== -->

    <main
        class="viewer"
        id="viewer">


        <!-- BOTÓN FULLSCREEN -->

        <header
            class="header">


            <button
                class="fullscreen-button"
                id="fullscreenButton"
                aria-label="Pantalla completa">

                ⛶

            </button>


        </header>


        <!-- LIBRO -->

        <section
            class="book-container">


            <div
                id="book"
                class="flip-book">
            </div>


        </section>


        <!-- CONTROLES -->

        <nav
            class="controls"
            aria-label="Controles del libro">


            <button
                class="control-button"
                id="previousButton"
                aria-label="Página anterior">

                ←

            </button>


            <div
                class="page-counter"
                id="pageCounter">

                1 / 32

            </div>


            <button
                class="control-button"
                id="nextButton"
                aria-label="Página siguiente">

                →

            </button>


        </nav>


    </main>


    <!-- =========================================
         LIBRERÍA PAGE FLIP
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js">
    </script>


    <script>


        /* =========================================
           CONFIGURACIÓN
        ========================================== */

        const totalPaginas = 32;


        const bookElement =
            document.getElementById("book");


        const pageCounter =
            document.getElementById("pageCounter");


        const loading =
            document.getElementById("loading");


        const previousButton =
            document.getElementById("previousButton");


        const nextButton =
            document.getElementById("nextButton");


        const fullscreenButton =
            document.getElementById("fullscreenButton");


        const viewer =
            document.getElementById("viewer");


        let pageFlip = null;


        /* =========================================
           CREAR PÁGINAS
        ========================================== */

        function crearPaginas() {


            for (
                let i = 1;
                i <= totalPaginas;
                i++
            ) {


                const page =
                    document.createElement("div");


                page.className =
                    "page";


                const image =
                    document.createElement("img");


                image.src =
                    `${i}.jpg`;


                image.alt =
                    `Página ${i} del Glosario ABC`;


                image.draggable =
                    false;


                /*
                 * La portada se carga inmediatamente.
                 * Las demás páginas se cargan
                 * progresivamente.
                 */

                if (i !== 1) {

                    image.loading =
                        "lazy";

                }


                page.appendChild(image);


                bookElement.appendChild(page);

            }

        }


        /* =========================================
           ACTUALIZAR CONTADOR
        ========================================== */

        function actualizarContador(numero) {


            const pagina =
                Math.min(
                    Math.max(
                        numero + 1,
                        1
                    ),
                    totalPaginas
                );


            pageCounter.textContent =
                `${pagina} / ${totalPaginas}`;

        }


        /* =========================================
           INICIAR LIBRO
        ========================================== */

        function iniciarLibro() {


            pageFlip =
                new St.PageFlip(
                    bookElement,
                    {


                        width: 400,

                        height: 600,


                        size: "stretch",


                        minWidth: 280,

                        maxWidth: 1000,


                        minHeight: 350,

                        maxHeight: 1200,


                        maxShadowOpacity: .35,


                        showCover: true,


                        flippingTime: 650,


                        usePortrait: true,


                        startPage: 0,


                        mobileScrollSupport: true


                    }
                );


            pageFlip.loadFromHTML(
                document.querySelectorAll(
                    ".page"
                )
            );


            /* =====================================
               CAMBIO DE PÁGINA
            ===================================== */

            pageFlip.on(
                "flip",
                (event) => {


                    actualizarContador(
                        event.data
                    );


                }
            );


            actualizarContador(0);


            /* =====================================
               OCULTAR PANTALLA DE CARGA
            ===================================== */

            setTimeout(
                () => {


                    loading.classList.add(
                        "hidden"
                    );


                },
                700
            );

        }


        /* =========================================
           BOTÓN ANTERIOR
        ========================================== */

        previousButton.addEventListener(
            "click",
            () => {


                if (!pageFlip)
                    return;


                pageFlip.flipPrev();


            }
        );


        /* =========================================
           BOTÓN SIGUIENTE
        ========================================== */

        nextButton.addEventListener(
            "click",
            () => {


                if (!pageFlip)
                    return;


                pageFlip.flipNext();


            }
        );


        /* =========================================
           TECLADO
        ========================================== */

        document.addEventListener(
            "keydown",
            (event) => {


                if (!pageFlip)
                    return;


                if (
                    event.key ===
                    "ArrowLeft"
                ) {


                    pageFlip.flipPrev();


                }


                if (
                    event.key ===
                    "ArrowRight"
                ) {


                    pageFlip.flipNext();


                }


                if (
                    event.key ===
                    "Home"
                ) {


                    pageFlip.turnToPage(0);


                }


                if (
                    event.key ===
                    "End"
                ) {


                    pageFlip.turnToPage(
                        totalPaginas - 1
                    );


                }


                if (
                    event.key ===
                    "Escape"
                ) {


                    salirPantallaCompleta();


                }

            }
        );


        /* =========================================
           PANTALLA COMPLETA
        ========================================== */

        async function cambiarPantallaCompleta() {


            try {


                if (
                    !document.fullscreenElement
                ) {


                    await viewer.requestFullscreen();


                }

                else {


                    await document.exitFullscreen();


                }


            }


            catch (error) {


                console.log(
                    "Pantalla completa no disponible:",
                    error
                );


            }

        }


        function salirPantallaCompleta() {


            if (
                document.fullscreenElement
            ) {


                document.exitFullscreen();


            }

        }


        fullscreenButton.addEventListener(
            "click",
            cambiarPantallaCompleta
        );


        /* =========================================
           CAMBIO DE ICONO FULLSCREEN
        ========================================== */

        document.addEventListener(
            "fullscreenchange",
            () => {


                if (
                    document.fullscreenElement
                ) {


                    document.body.classList.add(
                        "fullscreen-mode"
                    );


                    fullscreenButton.textContent =
                        "×";


                }


                else {


                    document.body.classList.remove(
                        "fullscreen-mode"
                    );


                    fullscreenButton.textContent =
                        "⛶";


                }

            }
        );


        /* =========================================
           RECALCULAR AL GIRAR EL DISPOSITIVO
        ========================================== */

        window.addEventListener(
            "orientationchange",
            () => {


                setTimeout(
                    () => {


                        if (
                            pageFlip
                        ) {


                            window.location.reload();


                        }


                    },
                    400
                );


            }
        );


        /* =========================================
           INICIAR
        ========================================== */

        document.addEventListener(
            "DOMContentLoaded",
            () => {


                crearPaginas();


                iniciarLibro();


            }
        );


    </script>


</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glosario Interactivo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #2c2c2c;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 1000px;
    }
    .flip-book {
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6); /* Sombra elegante alrededor del libro */
    }
    .page {
      background-color: transparent;
      overflow: hidden; /* Evita cualquier borde o sobrante */
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: fill; /* Extiende la imagen a sangre sin dejar márgenes blancos */
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="book" class="flip-book"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Ajusta este número si tu total de imágenes cambia
      const totalPaginas = 32; 

      const book = document.getElementById('book');

      // Generar automáticamente las páginas
      for (let i = 1; i <= totalPaginas; i++) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';
        pageDiv.innerHTML = `<img src="${i}.jpg" alt="Página ${i}">`;
        book.appendChild(pageDiv);
      }

      // Configuración optimizada del efecto StPageFlip
      const pageFlip = new St.PageFlip(book, {
        width: 400, // ancho de una página en px
        height: 600, // alto de una página en px
        size: "stretch",
        minWidth: 300,
        maxWidth: 1000,
        minHeight: 400,
        maxHeight: 1200,
        maxShadowOpacity: 0.3,
        showCover: false,      // Portada flexible (se dobla suavemente)
        flippingTime: 600,     // Animación rápida y fluida
        usePortrait: true,
        startPage: 0
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));
    });
  </script>
</body>
</html>

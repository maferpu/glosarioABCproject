<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#181818">
    <meta name="description" content="Glosario ABC — Libro interactivo">
    <title>Glosario ABC · Libro Interactivo</title>

    <style>
        /* =========================================
           1. RESET GENERAL Y CONTENEDOR RAIZ
        ========================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #3b3b3b 0%, #252525 45%, #151515 100%);
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================================
           2. ESTRUCTURA Y MARCOS DE PANTALLA
        ========================================== */
        .viewer {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 15px;
        }

        .header {
            position: fixed;
            top: 12px;
            right: 15px;
            z-index: 50;
        }

        .fullscreen-button {
            width: 38px;
            height: 38px;
            border: none;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.85;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-button:hover {
            opacity: 1;
            transform: scale(1.08);
            background: rgba(0, 0, 0, 0.7);
        }

        .book-wrapper {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 78vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* =========================================
           3. ESTILOS DE PÁGINA LIMPIOS (SIN SOLAPAMIENTO)
        ========================================== */
        .flip-book {
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
        }

        .page {
            background-color: #1e1e1e;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .page img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            user-select: none;
            pointer-events: none;
        }

        /* =========================================
           4. CONTROLES INFERIORES
        ========================================== */
        .controls {
            position: fixed;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }

        .control-button {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .page-counter {
            min-width: 65px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* =========================================
           5. PANTALLA DE CARGA Y PANTALLA DE ROTACIÓN
        ========================================== */
        .loading {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #181818;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader {
            width: 35px;
            height: 35px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 15px;
            font-size: 13px;
            letter-spacing: 2px;
            opacity: 0.7;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .rotate-message {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            background: radial-gradient(circle at center, #3b3b3b 0%, #181818 70%);
        }

        .rotate-icon {
            font-size: 48px;
            margin-bottom: 15px;
            animation: rotatePhone 2s ease-in-out infinite;
        }

        .rotate-message h2 {
            margin: 0 0 8px;
            font-size: 18px;
            font-weight: 500;
        }

        .rotate-message p {
            margin: 0;
            max-width: 250px;
            line-height: 1.4;
            font-size: 13px;
            opacity: 0.7;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            40%, 70% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        /* =========================================
           6. RESPONSIVE CELULAR HORIZONTAL / VERTICAL
        ========================================== */
        @media screen and (max-width: 768px) and (orientation: portrait) {
            .rotate-message { display: flex; }
            .viewer { display: none; }
        }

        @media screen and (max-width: 950px) and (orientation: landscape) {
            .viewer { padding: 5px; }
            .book-wrapper { max-height: 68vh; }
            .controls { bottom: 5px; padding: 3px 10px; }
            .control-button { width: 28px; height: 28px; font-size: 12px; }
            .header { top: 5px; right: 8px; }
            .fullscreen-button { width: 30px; height: 30px; font-size: 13px; }
        }
    </style>
</head>

<body>

    <!-- AVISO ROTACIÓN DE PANTALLA -->
    <section class="rotate-message" id="rotateMessage">
        <div class="rotate-icon">📱</div>
        <h2>Gira tu dispositivo</h2>
        <p>Para disfrutar mejor del libro interactivo, coloca tu teléfono en posición horizontal.</p>
    </section>

    <!-- CARGA -->
    <section class="loading" id="loading">
        <div class="loader"></div>
        <div class="loading-text">Cargando libro...</div>
    </section>

    <!-- VISOR PRINCIPAL -->
    <main class="viewer" id="viewer">
        <header class="header">
            <button class="fullscreen-button" id="fullscreenButton" aria-label="Pantalla completa">⛶</button>
        </header>

        <section class="book-wrapper">
            <div id="book" class="flip-book"></div>
        </section>

        <nav class="controls" aria-label="Controles del libro">
            <button class="control-button" id="previousButton" aria-label="Página anterior">←</button>
            <div class="page-counter" id="pageCounter">1 / 32</div>
            <button class="control-button" id="nextButton" aria-label="Página siguiente">→</button>
        </nav>
    </main>

    <!-- LIBRERÍA PAGE FLIP -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <script>
        const totalPaginas = 32;
        const bookElement = document.getElementById("book");
        const pageCounter = document.getElementById("pageCounter");
        const loading = document.getElementById("loading");
        const previousButton = document.getElementById("previousButton");
        const nextButton = document.getElementById("nextButton");
        const fullscreenButton = document.getElementById("fullscreenButton");
        const viewer = document.getElementById("viewer");

        let pageFlip = null;

        function ocultarCarga() {
            if (loading) {
                loading.classList.add("hidden");
            }
        }

        function crearPaginas() {
            bookElement.innerHTML = "";
            for (let i = 1; i <= totalPaginas; i++) {
                const page = document.createElement("div");
                page.className = "page";

                const image = document.createElement("img");
                image.src = `${i}.jpg`;
                image.alt = `Página ${i} del Glosario ABC`;

                page.appendChild(image);
                bookElement.appendChild(page);
            }
        }

        function actualizarContador(numero) {
            const pagina = Math.min(Math.max(numero + 1, 1), totalPaginas);
            pageCounter.textContent = `${pagina} / ${totalPaginas}`;
        }

        function iniciarLibro() {
            try {
                pageFlip = new St.PageFlip(bookElement, {
                    width: 400,
                    height: 600,
                    size: "contain",
                    minWidth: 150,
                    maxWidth: 1000,
                    minHeight: 225,
                    maxHeight: 1200,
                    maxShadowOpacity: 0.35,
                    showCover: true,
                    flippingTime: 650,
                    usePortrait: false,
                    startPage: 0,
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll(".page"));

                pageFlip.on("flip", (event) => {
                    actualizarContador(event.data);
                });

                actualizarContador(0);
            } catch (error) {
                console.error("Error inicializando el flipbook:", error);
            } finally {
                setTimeout(ocultarCarga, 400);
            }
        }

        previousButton.addEventListener("click", () => {
            if (pageFlip) pageFlip.flipPrev();
        });

        nextButton.addEventListener("click", () => {
            if (pageFlip) pageFlip.flipNext();
        });

        document.addEventListener("keydown", (event) => {
            if (!pageFlip) return;
            if (event.key === "ArrowLeft") pageFlip.flipPrev();
            if (event.key === "ArrowRight") pageFlip.flipNext();
            if (event.key === "Home") pageFlip.turnToPage(0);
            if (event.key === "End") pageFlip.turnToPage(totalPaginas - 1);
            if (event.key === "Escape") salirPantallaCompleta();
        });

        async function cambiarPantallaCompleta() {
            try {
                if (!document.fullscreenElement) {
                    await viewer.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                console.log("Pantalla completa no disponible:", error);
            }
        }

        function salirPantallaCompleta() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }

        fullscreenButton.addEventListener("click", cambiarPantallaCompleta);

        document.addEventListener("fullscreenchange", () => {
            if (document.fullscreenElement) {
                fullscreenButton.textContent = "×";
            } else {
                fullscreenButton.textContent = "⛶";
            }
            if (pageFlip) {
                setTimeout(() => pageFlip.update(), 150);
            }
        });

        window.addEventListener("resize", () => {
            if (pageFlip) {
                pageFlip.update();
            }
        });

        // Espera a la carga total del DOM y assets para prevenir descalibres
        window.addEventListener("load", () => {
            crearPaginas();
            iniciarLibro();
        });
    </script>
</body>
</html>
